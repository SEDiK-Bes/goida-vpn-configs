.github/workflows/update-configs.yml
name: 🚀 Auto Update VPN Configs

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Режим тестирования'
        required: false
        type: boolean
        default: false

jobs:
  update-configs:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.MY_TOKEN }}
      
      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: 📦 Install dependencies
        run: |
          pip install requests urllib3 PyGithub
      
      - name: 🚀 Run script
        env:
          MY_TOKEN: ${{ secrets.MY_TOKEN }}
          REPO_NAME: ${{ github.repository }}
        run: |
          if [ "${{ github.event.inputs.dry_run }}" == "true" ]; then
            python main.py --dry-run
          else:
            python main.py
          fi
      
      - name: 📊 Stats
        if: always()
        run: |
          echo "📁 Files:"
          ls -lh githubmirror/ || echo "Folder not created"
