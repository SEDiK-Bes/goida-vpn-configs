name: 🚀 GOIDA VPN Aggregator

on:
  schedule:
    - cron: '0 */6 * * *'  # Каждые 6 часов
  workflow_dispatch:       # Можно запустить вручную с GitHub UI

jobs:
  aggregate:
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests
      
      - name: 🌐 Run GOIDA VPN Aggregator
        env:
          MY_TOKEN: ${{ secrets.MY_TOKEN }}
          REPO_NAME: SEDiK-Bes/goida-vpn-configs
        run: |
          echo "🚀 Starting GOIDA VPN Aggregator v9.0"
          python main.py
      
      - name: ✅ Verify completion
        run: |
          echo ""
          echo "=========================================="
          echo "✅ Workflow execution completed"
          echo "=========================================="
          echo ""
          echo "📁 Repository: https://github.com/SEDiK-Bes/goida-vpn-configs"
          echo "📄 Files location: githubmirror/"
          echo "🔗 all.txt: https://raw.githubusercontent.com/SEDiK-Bes/goida-vpn-configs/main/githubmirror/all.txt"
          echo ""
          echo "⏰ Next run: In 6 hours (or manually from Actions tab)"
